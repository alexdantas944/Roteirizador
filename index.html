<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alex Motoboy">
<meta name="description" content="Controlador de gastos pessoal do Alex Motoboy">
<title>Alex Motoboy • Controle de Gastos</title>
<link rel="manifest" id="manifest">
<style>
:root{
  --bg:#08090b;--card:#111318;--card2:#17191f;--line:#292c34;
  --text:#f7f7f8;--muted:#989da8;--accent:#f4c542;--accent2:#ffdf73;
  --green:#42d392;--red:#ff5d6c;--blue:#5ea7ff;--shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 20% 0%,#25200e 0,#0b0b0d 28%,#08090b 70%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh;padding-bottom:100px}
button,input,select{font:inherit}
button{border:0}
.app{max-width:720px;margin:auto;padding:18px 15px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.avatar-wrap{position:relative}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);background:#1b1d22;display:block}
.avatar-fallback{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2a2a2d,#0e0f12);border:2px solid var(--accent);font-weight:900;font-size:18px}
.upload{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-size:13px;cursor:pointer;border:2px solid #090a0c}
.upload input{display:none}
h1{font-size:18px;margin:0;font-weight:850;letter-spacing:.2px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);cursor:pointer}
.hero{background:linear-gradient(145deg,#1b1b1e,#0f1014);border:1px solid #34302a;border-radius:25px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;right:-80px;top:-80px;background:rgba(244,197,66,.12);border-radius:50%;filter:blur(3px)}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.4px}
.total{font-size:39px;font-weight:950;letter-spacing:-1.5px;margin:7px 0 17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:13px}
.stat b{display:block;font-size:16px;margin-top:4px}
.stat span{font-size:11px;color:var(--muted)}
.green{color:var(--green)} .red{color:var(--red)}
.section{margin-top:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section h2{font-size:16px;margin:0}
.small{font-size:11px;color:var(--muted)}
.form{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px 3px}
.field input,.field select{width:100%;background:#0c0d10;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:13px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#111;font-weight:900;cursor:pointer}
.btn:active{transform:scale(.99)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.chip{white-space:nowrap;padding:9px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:11px;cursor:pointer}
.chip.active{background:rgba(244,197,66,.13);border-color:rgba(244,197,66,.55);color:var(--accent2)}
.list{display:grid;gap:9px}
.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;display:flex;align-items:center;gap:11px}
.dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#1a1c22;font-size:18px}
.info{min-width:0;flex:1}
.info strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:10px;color:var(--muted)}
.amount{text-align:right;font-weight:850;font-size:13px}
.delete{margin-left:3px;width:31px;height:31px;border-radius:10px;background:#1a1518;color:#ff7b86;cursor:pointer}
.empty{padding:30px 15px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:17px;font-size:12px}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(680px,calc(100% - 28px));background:rgba(17,19,24,.9);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.nav button{background:transparent;color:var(--muted);padding:8px;border-radius:13px;font-size:10px;cursor:pointer}
.nav button.active{background:rgba(244,197,66,.12);color:var(--accent)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);background:#f4c542;color:#111;padding:11px 15px;border-radius:12px;font-weight:800;font-size:12px;z-index:30;transition:.25s;box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0)}
.loading{opacity:.6;pointer-events:none}
@media(min-width:600px){.app{padding-top:28px}.hero{padding:28px}.total{font-size:48px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="avatar-wrap">
        <div id="avatarBox" class="avatar-fallback">AM</div>
        <label class="upload" title="Alterar foto">✎<input id="photoInput" type="file" accept="image/*"></label>
      </div>
      <div><h1>ALEX MOTOBOY</h1><div class="sub">Controle financeiro pessoal</div></div>
    </div>
    <button class="iconbtn" id="installBtn" title="Instalar app">⌁</button>
  </header>

  <section class="hero">
    <div class="label">Gastos acumulados</div>
    <div id="total" class="total">R$ 0,00</div>
    <div class="stats">
      <div class="stat"><span>Hoje</span><b id="today" class="red">R$ 0,00</b></div>
      <div class="stat"><span>Quantidade</span><b id="count">0 gastos</b></div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Novo gasto</h2><span class="small">salvo automaticamente</span></div>
    <form id="expenseForm" class="form">
      <div class="row">
        <div class="field"><label>Valor</label><input id="amount" type="number" step="0.01" min="0.01" placeholder="0,00" required></div>
        <div class="field"><label>Data</label><input id="date" type="date" required></div>
      </div>
      <div class="row">
        <div class="field"><label>Descrição</label><input id="description" maxlength="80" placeholder="Ex.: combustível" required></div>
        <div class="field"><label>Categoria</label>
          <select id="category">
            <option value="Combustível">⛽ Combustível</option>
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Manutenção">🔧 Manutenção</option>
            <option value="Moto">🏍️ Moto</option>
            <option value="Casa">🏠 Casa</option>
            <option value="Contas">📄 Contas</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Outros">📦 Outros</option>
          </select>
        </div>
      </div>
      <button class="btn" id="saveBtn">+ ADICIONAR GASTO</button>
    </form>
  </section>

  <section class="section">
    <div class="section-head"><h2>Seus gastos</h2><span id="periodTotal" class="small">R$ 0,00</span></div>
    <div class="filters">
      <button class="chip active" data-filter="all">Todos</button>
      <button class="chip" data-filter="today">Hoje</button>
      <button class="chip" data-filter="week">7 dias</button>
      <button class="chip" data-filter="month">Este mês</button>
    </div>
    <div id="list" class="list" style="margin-top:10px"></div>
  </section>
</main>

<nav class="nav">
  <button class="active" onclick="scrollToEl('.hero')">⌂<br>Resumo</button>
  <button onclick="scrollToEl('#expenseForm')">＋<br>Novo gasto</button>
  <button onclick="scrollToEl('.list')">☷<br>Histórico</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   ALEX MOTOBOY • CONTROLADOR DE GASTOS
   SUPABASE CONFIG
   ========================================================= */
const SUPABASE_URL = "https://htkqxttctkygzxubjhjy.supabase.co";
const SUPABASE_KEY = "sb_publishable_PvIjt7O1XsDIr1rs4fj99w_wcpcSA7L";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/*
SQL NECESSÁRIO — execute UMA VEZ no SQL Editor do Supabase:

create table if not exists public.alex_gastos (
  id bigint generated by default as identity primary key,
  device_id text not null,
  amount numeric(12,2) not null check (amount > 0),
  description text not null,
  category text not null,
  spent_at date not null default current_date,
  created_at timestamptz not null default now()
);

alter table public.alex_gastos enable row level security;

drop policy if exists "alex_gastos_select" on public.alex_gastos;
drop policy if exists "alex_gastos_insert" on public.alex_gastos;
drop policy if exists "alex_gastos_delete" on public.alex_gastos;

create policy "alex_gastos_select" on public.alex_gastos
for select to anon using (device_id = current_setting('request.headers', true)::json->>'x-device-id');

create policy "alex_gastos_insert" on public.alex_gastos
for insert to anon with check (device_id = current_setting('request.headers', true)::json->>'x-device-id');

create policy "alex_gastos_delete" on public.alex_gastos
for delete to anon using (device_id = current_setting('request.headers', true)::json->>'x-device-id');

grant select, insert, delete on public.alex_gastos to anon;
grant usage, select on sequence public.alex_gastos_id_seq to anon;

-- IMPORTANTE:
-- A aplicação também envia x-device-id em cada requisição.
*/

let DEVICE_ID = localStorage.getItem("alex_motoboy_device_id");
if(!DEVICE_ID){
  DEVICE_ID = crypto.randomUUID();
  localStorage.setItem("alex_motoboy_device_id", DEVICE_ID);
}

const money = n => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);
const todayISO = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const icons = {"Combustível":"⛽","Alimentação":"🍔","Manutenção":"🔧","Moto":"🏍️","Casa":"🏠","Contas":"📄","Lazer":"🎮","Outros":"📦"};

let expenses = [];
let activeFilter = "all";
let deferredPrompt = null;

const dateInput = document.getElementById("date");
dateInput.value = todayISO();

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),2200);
}

function headers(){
  return {"x-device-id":DEVICE_ID};
}

async function loadExpenses(){
  try{
    const {data,error}=await db.from("alex_gastos").select("*").eq("device_id",DEVICE_ID).order("spent_at",{ascending:false}).order("created_at",{ascending:false});
    if(error) throw error;
    expenses=data||[];
    render();
  }catch(e){
    console.error(e);
    toast("Não foi possível carregar. Verifique o SQL/RLS.");
    render();
  }
}

async function addExpense(e){
  e.preventDefault();
  const amount=Number(document.getElementById("amount").value);
  const description=document.getElementById("description").value.trim();
  const category=document.getElementById("category").value;
  const spent_at=document.getElementById("date").value;
  if(!amount||amount<=0||!description||!spent_at) return toast("Preencha os campos.");
  const btn=document.getElementById("saveBtn");
  btn.disabled=true; btn.textContent="SALVANDO...";
  try{
    const {data,error}=await db.from("alex_gastos").insert({device_id:DEVICE_ID,amount,description,category,spent_at}).select().single();
    if(error) throw error;
    expenses.unshift(data);
    document.getElementById("expenseForm").reset();
    dateInput.value=todayISO();
    document.getElementById("category").value="Combustível";
    render(); toast("Gasto adicionado ✓");
  }catch(e){
    console.error(e); toast("Erro ao salvar. Confira o SQL/RLS.");
  }finally{btn.disabled=false;btn.textContent="+ ADICIONAR GASTO";}
}

async function removeExpense(id){
  if(!confirm("Excluir este gasto?")) return;
  try{
    const {error}=await db.from("alex_gastos").delete().eq("id",id).eq("device_id",DEVICE_ID);
    if(error) throw error;
    expenses=expenses.filter(x=>x.id!==id); render(); toast("Gasto excluído");
  }catch(e){console.error(e);toast("Não foi possível excluir.");}
}

function filtered(){
  const now=new Date(); now.setHours(0,0,0,0);
  return expenses.filter(x=>{
    const d=new Date(x.spent_at+"T00:00:00");
    if(activeFilter==="today") return x.spent_at===todayISO();
    if(activeFilter==="week"){const diff=(now-d)/86400000;return diff>=0&&diff<7;}
    if(activeFilter==="month") return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;
  });
}

function render(){
  const allTotal=expenses.reduce((s,x)=>s+Number(x.amount),0);
  const todayTotal=expenses.filter(x=>x.spent_at===todayISO()).reduce((s,x)=>s+Number(x.amount),0);
  document.getElementById("total").textContent=money(allTotal);
  document.getElementById("today").textContent=money(todayTotal);
  document.getElementById("count").textContent=`${expenses.length} ${expenses.length===1?"gasto":"gastos"}`;
  const list=filtered();
  document.getElementById("periodTotal").textContent=money(list.reduce((s,x)=>s+Number(x.amount),0));
  const box=document.getElementById("list");
  if(!list.length){box.innerHTML='<div class="empty">Nenhum gasto encontrado neste período.<br>Adicione seu primeiro gasto acima.</div>';return;}
  box.innerHTML=list.map(x=>`
    <article class="item">
      <div class="dot">${icons[x.category]||"📦"}</div>
      <div class="info"><strong>${esc(x.description)}</strong><span>${esc(x.category)} • ${new Date(x.spent_at+"T00:00:00").toLocaleDateString("pt-BR")}</span></div>
      <div class="amount red">-${money(x.amount)}</div>
      <button class="delete" onclick="removeExpense(${Number(x.id)})" title="Excluir">×</button>
    </article>`).join("");
}

document.getElementById("expenseForm").addEventListener("submit",addExpense);
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  c.classList.add("active"); activeFilter=c.dataset.filter; render();
}));

function scrollToEl(sel){document.querySelector(sel)?.scrollIntoView({behavior:"smooth",block:"start"});}

document.getElementById("photoInput").addEventListener("change",e=>{
  const file=e.target.files?.[0]; if(!file)return;
  if(file.size>2.5*1024*1024)return toast("Escolha uma foto de até 2,5 MB.");
  const reader=new FileReader();
  reader.onload=()=>{localStorage.setItem("alex_motoboy_photo",reader.result);setAvatar(reader.result);toast("Foto atualizada ✓");};
  reader.readAsDataURL(file);
});
function setAvatar(src){
  const box=document.getElementById("avatarBox");
  box.outerHTML=`<img id="avatarBox" class="avatar" src="${src}" alt="Alex Motoboy">`;
}
const savedPhoto=localStorage.getItem("alex_motoboy_photo"); if(savedPhoto)setAvatar(savedPhoto);

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.visibility="visible";});
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(!deferredPrompt){toast("Use o menu do navegador para instalar.");return;}
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
});

const manifest={
  name:"Alex Motoboy • Controle de Gastos",short_name:"Alex Gastos",start_url:location.href,
  display:"standalone",background_color:"#08090b",theme_color:"#0b0b0d",
  description:"Controlador de gastos pessoal",icons:[]
};
document.getElementById("manifest").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(manifest));

/* Supabase JS permite criar o client diretamente no navegador usando a publishable key.
   A segurança dos dados depende das políticas RLS acima. */
loadExpenses();
</script>
</body>
</html>
